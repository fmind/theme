# fmind — generated by render.py, do not edit
# source: palettes/fmind.yaml
#
# Point fzf at this file with FZF_DEFAULT_OPTS_FILE. Colours are ANSI slot
# numbers so the finder follows the terminal; -1 means 'leave it alone'.

# base16 first: everything not named below falls back to a palette slot
# rather than to one of fzf's own 256-colour defaults.
--color=base16

# ground and body, left to the terminal
--color=fg:-1        # the terminal's own foreground
--color=bg:-1        # transparent over the prompt
--color=gutter:-1    # no bar down the left
--color=query:-1     # what you typed reads as input

# the current line
--color=fg+:-1       # body colour, not an accent
--color=bg+:0        # slot 0, the palette's own dark
--color=hl:10        # escape — the matched run
--color=hl+:10       # escape — matched, on the current line

# chrome recedes, the way comments do
--color=border:8     # comment
--color=separator:8  # comment
--color=scrollbar:8  # comment
--color=info:8       # comment
--color=disabled:8   # comment

# what you point at and what you pick
--color=prompt:5     # keyword
--color=pointer:11   # constant
--color=marker:12    # parameter
--color=spinner:14   # property
--color=header:6     # type
--color=label:6      # type
