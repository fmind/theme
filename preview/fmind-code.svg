<svg xmlns="http://www.w3.org/2000/svg" width="464" height="212" viewBox="0 0 464 212" role="img" aria-label="fmind syntax preview">
  <rect width="100%" height="100%" fill="#080b08"/>
  <g font-family="FiraCode Nerd Font Mono, Fira Code, DejaVu Sans Mono, monospace" font-size="14" font-feature-settings="&apos;liga&apos; 0, &apos;calt&apos; 0">
    <text xml:space="preserve" x="18.0" y="33.0"><tspan fill="#7e8a7b"># measured on the shipped hex, not the design value</tspan></text>
    <text xml:space="preserve" x="18.0" y="55.0"><tspan fill="#9578ff" font-weight="bold">def </tspan><tspan fill="#35ab24" font-weight="bold">audit</tspan><tspan fill="#a1a6a0">(</tspan><tspan fill="#029fd7">pal</tspan><tspan fill="#a1a6a0">: </tspan><tspan fill="#2ad7f5">Palette</tspan><tspan fill="#a1a6a0">, </tspan><tspan fill="#029fd7">cut</tspan><tspan fill="#a1a6a0">: </tspan><tspan fill="#2ad7f5">float</tspan><tspan fill="#a1a6a0">) -&gt; </tspan><tspan fill="#2ad7f5">list</tspan><tspan fill="#a1a6a0">[</tspan><tspan fill="#2ad7f5">str</tspan><tspan fill="#a1a6a0">]:</tspan></text>
    <text xml:space="preserve" x="18.0" y="77.0"><tspan fill="#a1a6a0">    </tspan><tspan fill="#56ff40">problems</tspan><tspan fill="#a1a6a0">: </tspan><tspan fill="#2ad7f5">list</tspan><tspan fill="#a1a6a0">[</tspan><tspan fill="#2ad7f5">str</tspan><tspan fill="#a1a6a0">] = []</tspan></text>
    <text xml:space="preserve" x="18.0" y="99.0"><tspan fill="#a1a6a0">    </tspan><tspan fill="#9578ff" font-weight="bold">for </tspan><tspan fill="#56ff40">a</tspan><tspan fill="#a1a6a0">, </tspan><tspan fill="#56ff40">b</tspan><tspan fill="#9578ff" font-weight="bold"> in </tspan><tspan fill="#e784f6">combinations</tspan><tspan fill="#a1a6a0">(</tspan><tspan fill="#029fd7">pal</tspan><tspan fill="#a1a6a0">.</tspan><tspan fill="#17bfa6">roles</tspan><tspan fill="#a1a6a0">, </tspan><tspan fill="#ff7800">2</tspan><tspan fill="#a1a6a0">):</tspan></text>
    <text xml:space="preserve" x="18.0" y="121.0"><tspan fill="#a1a6a0">        </tspan><tspan fill="#56ff40">got</tspan><tspan fill="#a1a6a0"> = </tspan><tspan fill="#35ab24" font-weight="bold">separation</tspan><tspan fill="#a1a6a0">(</tspan><tspan fill="#029fd7">pal</tspan><tspan fill="#a1a6a0">.</tspan><tspan fill="#17bfa6">role</tspan><tspan fill="#a1a6a0">(</tspan><tspan fill="#56ff40">a</tspan><tspan fill="#a1a6a0">), </tspan><tspan fill="#029fd7">pal</tspan><tspan fill="#a1a6a0">.</tspan><tspan fill="#17bfa6">role</tspan><tspan fill="#a1a6a0">(</tspan><tspan fill="#56ff40">b</tspan><tspan fill="#a1a6a0">))</tspan></text>
    <text xml:space="preserve" x="18.0" y="143.0"><tspan fill="#a1a6a0">        </tspan><tspan fill="#9578ff" font-weight="bold">if </tspan><tspan fill="#56ff40">got</tspan><tspan fill="#a1a6a0"> &lt; </tspan><tspan fill="#f8cc28">MIN_GAP</tspan><tspan fill="#a1a6a0">:</tspan></text>
    <text xml:space="preserve" x="18.0" y="165.0"><tspan fill="#a1a6a0">            </tspan><tspan fill="#56ff40">problems</tspan><tspan fill="#a1a6a0">.</tspan><tspan fill="#17bfa6">append</tspan><tspan fill="#a1a6a0">(</tspan><tspan fill="#d6d8d6">f"</tspan><tspan fill="#26fed9">{</tspan><tspan fill="#56ff40">a</tspan><tspan fill="#26fed9">}</tspan><tspan fill="#d6d8d6">/</tspan><tspan fill="#26fed9">{</tspan><tspan fill="#56ff40">b</tspan><tspan fill="#26fed9">}</tspan><tspan fill="#d6d8d6"> </tspan><tspan fill="#26fed9">{</tspan><tspan fill="#56ff40">got</tspan><tspan fill="#26fed9">:.3f}</tspan><tspan fill="#26fed9">\n</tspan><tspan fill="#d6d8d6">"</tspan><tspan fill="#a1a6a0">)</tspan></text>
    <text xml:space="preserve" x="18.0" y="187.0"><tspan fill="#a1a6a0">    </tspan><tspan fill="#9578ff" font-weight="bold">return </tspan><tspan fill="#56ff40">problems</tspan></text>
  </g>
</svg>
