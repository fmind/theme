# Palette source of truth. Regenerate tool files with: uv run render.py
# Designed by explore.py against the contract in palette.py.
name: "Prime Lanes"
family: "one change from Prime"
description: >-
  Prime with the warm and cool lanes: primaries run warm, their relatives run cool, so kinship reads as a shift in temperature.
ground: "#040d07"
text: "#1dff00"
cursor: "#3effb7"
ansi:
  black: "#223d27"
  red: "#f8363d"
  green: "#d5fcd5"
  yellow: "#e9a613"
  blue: "#008e00"
  magenta: "#87ef8c"
  cyan: "#2ac91c"
  white: "#d5e2d7"
  bright_black: "#24682c"
  bright_red: "#f6835c"
  bright_green: "#3effb7"
  bright_yellow: "#ffd043"
  bright_blue: "#00be8c"
  bright_magenta: "#18ce96"
  bright_cyan: "#03eea9"
  bright_white: "#f2f9f3"

# Which syntax role each slot carries, and where it landed.
roles:
  variable: "#1dff00"  # text, hue 142, chroma 0.293
  error: "#f8363d"  # red, hue 25, chroma 0.228
  string: "#d5fcd5"  # green, hue 145, chroma 0.066
  number: "#e9a613"  # yellow, hue 79, chroma 0.157
  function: "#008e00"  # blue, hue 142, chroma 0.191
  keyword: "#87ef8c"  # magenta, hue 145, chroma 0.166
  type: "#2ac91c"  # cyan, hue 142, chroma 0.236
  comment: "#24682c"  # bright_black, hue 145, chroma 0.115
  warning: "#f6835c"  # bright_red, hue 39, chroma 0.151
  escape: "#3effb7"  # bright_green, hue 162, chroma 0.18
  constant: "#ffd043"  # bright_yellow, hue 90, chroma 0.159
  parameter: "#00be8c"  # bright_blue, hue 166, chroma 0.148
  builtin: "#18ce96"  # bright_magenta, hue 165, chroma 0.156
  property: "#03eea9"  # bright_cyan, hue 163, chroma 0.18

