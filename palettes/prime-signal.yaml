# Palette source of truth. Regenerate tool files with: uv run render.py
# Designed by explore.py against the contract in palette.py.
name: "Prime Signal"
family: "one change from Prime"
description: >-
  Prime with Signal's red pair - a hotter error and a properly orange warning, rather than the softer reds Arc carries.
ground: "#040d07"
text: "#00fe45"
cursor: "#65fea5"
ansi:
  black: "#223d27"
  red: "#f4313a"
  green: "#cefddc"
  yellow: "#e7a800"
  blue: "#009f5b"
  magenta: "#77eea5"
  cyan: "#00d123"
  white: "#d5e2d7"
  bright_black: "#006a39"
  bright_red: "#ff7840"
  bright_green: "#65fea5"
  bright_yellow: "#ffd74d"
  bright_blue: "#3fcb8c"
  bright_magenta: "#3ec97c"
  bright_cyan: "#6dfab1"
  bright_white: "#f2f9f3"

# Which syntax role each slot carries, and where it landed.
roles:
  variable: "#00fe45"  # text, hue 145, chroma 0.275
  error: "#f4313a"  # red, hue 25, chroma 0.228
  string: "#cefddc"  # green, hue 154, chroma 0.065
  number: "#e7a800"  # yellow, hue 81, chroma 0.159
  function: "#009f5b"  # blue, hue 155, chroma 0.152
  keyword: "#77eea5"  # magenta, hue 155, chroma 0.15
  type: "#00d123"  # cyan, hue 143, chroma 0.246
  comment: "#006a39"  # bright_black, hue 154, chroma 0.115
  warning: "#ff7840"  # bright_red, hue 42, chroma 0.179
  escape: "#65fea5"  # bright_green, hue 155, chroma 0.18
  constant: "#ffd74d"  # bright_yellow, hue 92, chroma 0.156
  parameter: "#3fcb8c"  # bright_blue, hue 159, chroma 0.151
  builtin: "#3ec97c"  # bright_magenta, hue 155, chroma 0.163
  property: "#6dfab1"  # bright_cyan, hue 158, chroma 0.161

measured:
  green_share: 67
  text_contrast: 14.3
  accent_floor: 5.0
  neon: 0.275
  min_chroma: 0.15
  min_separation: 0.11
  tightest_pair: "function/parameter"
  slack: 0.005
