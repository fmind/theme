# Palette source of truth. Regenerate tool files with: uv run render.py
# Every value here is measured against the contract in palette.py.
name: "fmind"
description: >-
  Neon green body on a ground just off black. Green carries what you wrote, three
  cool tiers carry what the language knows, orange holds the numbers and one
  violet holds the keyword. Strings are a plain white so prose reads as prose,
  and the two things you do not read genuinely recede: comments stay grey and
  delimiters go quiet chalk, so the body is the brightest thing on the line.
ground: "#080b08"
text: "#56ff40"
cursor: "#26fed9"
ansi:
  black: "#243c29"
  red: "#f63a4b"
  green: "#d6d8d6"
  yellow: "#ff7800"
  blue: "#35ab24"
  magenta: "#9578ff"
  cyan: "#2ad7f5"
  white: "#a1a6a0"
  bright_black: "#7e8a7b"
  bright_red: "#faa77b"
  bright_green: "#26fed9"
  bright_yellow: "#f8cc28"
  bright_blue: "#029fd7"
  bright_magenta: "#e784f6"
  bright_cyan: "#17bfa6"
  bright_white: "#f1f8f2"

# Which syntax role each slot carries, and where it landed.
roles:
  variable: "#56ff40"  # text, hue 142, chroma 0.264
  error: "#f63a4b"  # red, hue 22, chroma 0.222
  string: "#d6d8d6"  # green, hue 146, chroma 0.003
  number: "#ff7800"  # yellow, hue 50, chroma 0.191
  function: "#35ab24"  # blue, hue 141, chroma 0.198
  keyword: "#9578ff"  # magenta, hue 290, chroma 0.193
  type: "#2ad7f5"  # cyan, hue 213, chroma 0.135
  punctuation: "#a1a6a0"  # white, hue 141, chroma 0.010
  comment: "#7e8a7b"  # bright_black, hue 139, chroma 0.026
  warning: "#faa77b"  # bright_red, hue 48, chroma 0.115
  escape: "#26fed9"  # bright_green, hue 177, chroma 0.161
  constant: "#f8cc28"  # bright_yellow, hue 92, chroma 0.168
  parameter: "#029fd7"  # bright_blue, hue 233, chroma 0.136
  builtin: "#e784f6"  # bright_magenta, hue 322, chroma 0.186
  property: "#17bfa6"  # bright_cyan, hue 179, chroma 0.129
