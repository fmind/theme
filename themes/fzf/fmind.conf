# https://github.com/junegunn/fzf/blob/master/man/man1/fzf.1
#
# Point fzf at this file with FZF_DEFAULT_OPTS_FILE. Explicit role colours
# stay independent of ANSI hue slots; -1 inherits the terminal default.

# base16 first: everything not named below falls back to a palette slot
# rather than to one of fzf's own 256-colour defaults.
--color=base16

# ground and body, left to the terminal
--color=fg:-1              # the terminal's own foreground
--color=bg:-1              # transparent over the prompt
--color=gutter:-1          # no bar down the left
--color=query:-1           # what you typed reads as input

# the current line
--color=fg+:-1             # body colour, not an accent
--color=bg+:#d2e3fc        # light selection surface
--color=hl:#174ea6         # escape — the matched run
--color=hl+:#174ea6        # escape — matched, on the current line

# chrome recedes, the way comments do
--color=border:#9aa0a6     # comment
--color=separator:#9aa0a6  # comment
--color=scrollbar:#595d62  # visible position indicator
--color=info:#595d62       # comment
--color=disabled:#595d62   # comment

# what you point at and what you pick
--color=prompt:#174ea6     # keyword
--color=pointer:#934900    # constant
--color=marker:#202124     # parameter
--color=spinner:#202124    # property
--color=header:#681da8     # type
--color=label:#681da8      # type
