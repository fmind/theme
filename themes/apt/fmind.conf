// https://manpages.debian.org/trixie/apt/apt.conf.5.en.html
// APT 3.x decodes the literal \\x1B prefix; keep the uppercase B.
APT::Color "true";
APT::Color::Blue "\x1B[38;2;23;78;166m";
APT::Color::Red "\x1B[38;2;165;14;14m";
APT::Color::Green "\x1B[38;2;13;101;45m";
APT::Color::Yellow "\x1B[38;2;147;73;0m";
APT::Color::Magenta "\x1B[38;2;104;29;168m";
APT::Color::Cyan "\x1B[38;2;0;99;109m";
APT::Color::White "\x1B[38;2;32;33;36m";
APT::Color::Highlight "blue";
APT::Color::Show::Package "blue";
APT::Color::Show::Field "bold blue";
APT::Color::Action::Install "green";
APT::Color::Action::Install-Dependencies "green";
APT::Color::Action::Upgrade "blue";
APT::Color::Action::Downgrade "yellow";
APT::Color::Action::Remove "red";
