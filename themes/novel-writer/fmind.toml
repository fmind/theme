# Fmind colour theme for novelWriter 26.2 and later.
# Format: novelWriter's "Custom Themes" documentation; modelled on its bundled default_light.toml.

[Main]
name   = "Fmind"
mode   = "light"
author = "Médéric Hurier"
credit = "Médéric Hurier"
url    = "https://github.com/fmind/theme"

# Yellow uses dark orange: palette yellow is too pale for icons on white.
[Base]
base    = "#ffffff"
default = "#202124"
faded   = "#595d62"
red     = "#a50e0e"
orange  = "#934900"
yellow  = "#934900"
green   = "#0d652d"
cyan    = "#00636d"
blue    = "#174ea6"
purple  = "#681da8"

[Project]
root     = "blue"
folder   = "yellow"
file     = "default"
title    = "green"
chapter  = "red"
scene    = "blue"
note     = "yellow"
active   = "green"
inactive = "red"
disabled = "faded"

[Icon]
tool      = "default"
sidebar   = "default"
accept    = "green"
reject    = "red"
action    = "blue"
option    = "orange"
apply     = "green"
create    = "yellow"
destroy   = "faded"
reset     = "green"
add       = "green"
change    = "green"
remove    = "red"
shortcode = "default"
markdown  = "orange"
system    = "yellow"
info      = "blue"
warning   = "orange"
error     = "red"

[Palette]
window          = "#f1f3f4"
windowText      = "default"
base            = "base"
alternateBase   = "#f1f3f4"
text            = "default"
tooltipBase     = "#feefc3"
tooltipText     = "default"
button          = "#f1f3f4"
buttonText      = "default"
brightText      = "base"
highlight       = "#d2e3fc"
highlightedText = "default"
link            = "blue"
linkVisited     = "blue"
accent          = "blue"

[GUI]
helpText     = "faded"
fadedText    = "faded"
errorText    = "red"
accentText   = "blue"
activeButton = "#d2e3fc"
activeBase   = "base"
searchMatch  = "#feefc3"

[Syntax]
background     = "base"
text           = "default"
line           = "#f1f3f4"
link           = "blue"
headerText     = "blue"
headerTag      = "faded"
emphasis       = "purple"
whitespace     = "#feefc3"
dialog         = "green"
altDialog      = "cyan"
note           = "orange"
hidden         = "faded"
shortcode      = "blue"
keyword        = "blue"
tag            = "purple"
value          = "green"
optional       = "cyan"
spellCheckLine = "#ea4335"
errorLine      = "#ea4335"
replaceTag     = "purple"
modifier       = "orange"
textHighlight  = "#fbbc04"
