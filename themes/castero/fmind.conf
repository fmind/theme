# https://github.com/xgi/castero/blob/master/castero/templates/castero.conf
# Use with a Fmind terminal palette: -1/transparent keep the terminal's charcoal text on white,
# and 231 is the fixed xterm-256 white for selected text on ANSI blue.
[colors]
color_foreground = -1
color_background = transparent
color_foreground_alt = 231
color_background_alt = blue
color_foreground_dim = green
color_foreground_status = -1
color_foreground_heading = blue
color_foreground_dividers = 8
