# yaml-language-server: $schema=https://gh-dash.dev/schema.json
# Docs: https://www.gh-dash.dev/configuration/theme/

theme:
  colors:
    text:
      primary: '#202124'
      secondary: '#202124'
      inverted: '#ffffff'
      faint: '#595d62'
      warning: '#934900'
      error: '#a50e0e'
      success: '#0d652d'
      actor: '#174ea6'
    background:
      selected: '#d2e3fc'
    border:
      primary: '#174ea6'
      secondary: '#595d62'
      faint: '#595d62'
