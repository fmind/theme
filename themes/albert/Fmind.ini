; Fmind theme for Albert's Widgets BoxModel frontend.
; Keys follow upstream themes/Theme.ini.template.

[palette]
base=#ffffff
text=#202124
window=#ffffff
window_text=#202124
button=#f1f3f4
button_text=#202124
highlight=#d2e3fc
highlight_text=#202124
placeholder_text=#595d62
link=#174ea6
link_visited=#681da8
; Set all three, otherwise Albert derives non-palette shades from button.
light=#ffffff
mid=#9aa0a6
dark=#595d62

; Most window colors default to palette/highlight, which is too pale for the
; trigger text and the input border on white. Fmind is flat, so no shadow.
[window]
window_shadow_brush=transparent
window_border_brush=#9aa0a6
input_border_brush=#4285f4
input_trigger_color=#174ea6
settings_button_color=#595d62
settings_button_highlight_color=#4285f4
