# https://wiki.hypr.land/Hypr-Ecosystem/hyprlock/
# Visual widgets only; authentication and session-lock policy use app defaults.
background {
    monitor =
    color = rgba(ffffffff)
}

input-field {
    monitor =
    size = 320, 56
    outline_thickness = 2
    rounding = 12
    inner_color = rgba(ffffffff)
    outer_color = rgba(174ea6ff)
    check_color = rgba(0d652dff)
    fail_color = rgba(a50e0eff)
    capslock_color = rgba(934900ff)
    numlock_color = rgba(00636dff)
    bothlock_color = rgba(934900ff)
    font_color = rgba(202124ff)
    font_family = Google Sans
    placeholder_text = Password
    fail_text = $PAMFAIL$FPRINTFAIL
    fade_on_empty = false
    position = 0, -40
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    color = rgba(202124ff)
    font_family = Google Sans
    font_size = 64
    position = 0, 80
    halign = center
    valign = center
}
