# https://docs.evidence.dev/features/themes
# Fmind is light only: dark values are omitted, so dark mode keeps the Evidence defaults.
colors:
  base:
    light: "#ffffff"
  card:
    light: "#ffffff"
  cardLayoutBackground:
    light: "#f1f3f4"
  positive:
    light: "#0d652d"
  negative:
    light: "#a50e0e"
# Ten colours fill every default series slot, so no Evidence default remains.
colorPalettes:
  default:
    light: ["#174ea6", "#a50e0e", "#0d652d", "#934900", "#681da8", "#00636d", "#4285f4", "#ea4335", "#34a853", "#e37400"]
colorScales:
  default:
    light: ["#d2e3fc", "#174ea6"]
table:
  linkColor:
    light: "#174ea6"
