# Fmind theme for Amfora
# Text keys are set explicitly: their defaults follow the terminal background, not "bg".
[theme]
bg = "#ffffff"
tab_num = "#174ea6"
tab_divider = "#9aa0a6"
bottombar_label = "#174ea6"
bottombar_text = "#202124"
bottombar_bg = "#f1f3f4"
scrollbar = "#595d62"
hdg_1 = "#174ea6"
hdg_2 = "#174ea6"
hdg_3 = "#174ea6"
amfora_link = "#174ea6"
foreign_link = "#00636d"
link_number = "#595d62"
regular_text = "#202124"
quote_text = "#595d62"
preformatted_text = "#202124"
list_text = "#202124"
