# https://github.com/tmux/tmux/wiki/Getting-Started#changing-the-status-line
set -g status-style 'fg=#202124,bg=#f1f3f4'
set -g message-style 'fg=#202124,bg=#d2e3fc'
set -g message-command-style 'fg=#202124,bg=#feefc3'
set -g mode-style 'fg=#202124,bg=#d2e3fc'
set -g pane-border-style 'fg=#9aa0a6'
set -g pane-active-border-style 'fg=#174ea6'
set -g pane-border-format '#{pane_index} #{pane_title}'
set -g display-panes-colour '#595d62'
set -g display-panes-active-colour '#174ea6'
set -g clock-mode-colour '#174ea6'
set -g window-status-style 'fg=#595d62,bg=#f1f3f4'
set -g window-status-current-style 'fg=#202124,bg=#fbbc04,bold'
set -g window-status-activity-style 'fg=#174ea6,bg=#d2e3fc,bold'
set -g window-status-bell-style 'fg=#a50e0e,bg=#fad2cf,bold'
set -g window-status-last-style 'fg=#681da8,bg=#f1f3f4'
