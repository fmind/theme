# https://k9scli.io/topics/skins/
k9s:
  body:
    fgColor: &text "#202124"
    bgColor: &background "#ffffff"
    logoColor: &blue "#174ea6"
    logoColorMsg: *text
    logoColorInfo: "#00636d"
    logoColorWarn: &amber "#934900"
    logoColorError: &red "#a50e0e"
  prompt:
    fgColor: *text
    bgColor: *background
    suggestColor: &muted "#595d62"
    border:
      command: *blue
      default: *muted
  help:
    fgColor: *text
    bgColor: *background
    sectionColor: *blue
    keyColor: *amber
    numKeyColor: *amber
  info:
    fgColor: *text
    sectionColor: *blue
    cpuColor: &green "#0d652d"
    memColor: &purple "#681da8"
    k9sRevColor: *blue
  dialog:
    fgColor: *text
    bgColor: *background
    buttonFgColor: *text
    buttonBgColor: &blueFill "#4285f4"
    buttonFocusFgColor: *text
    buttonFocusBgColor: &yellow "#fbbc04"
    labelFgColor: *purple
    fieldFgColor: *text
  frame:
    border:
      fgColor: *muted
      focusColor: *blue
    menu:
      fgColor: *text
      fgStyle: normal
      keyColor: *amber
      numKeyColor: *amber
    crumbs:
      fgColor: *text
      bgColor: *blueFill
      activeColor: *yellow
    status:
      newColor: *green
      modifyColor: *amber
      addColor: *green
      pendingColor: *amber
      errorColor: *red
      highlightColor: *blue
      killColor: *red
      completedColor: *muted
    title:
      fgColor: *blue
      bgColor: *background
      highlightColor: *amber
      counterColor: *text
      filterColor: *purple
  views:
    table:
      fgColor: *text
      bgColor: *background
      cursorFgColor: *text
      cursorBgColor: &selection "#d2e3fc"
      markColor: *amber
      header:
        fgColor: *blue
        bgColor: *background
        sorterColor: *amber
        selectedSortColumnColor: *purple
    charts:
      bgColor: *background
      dialBgColor: *background
      chartBgColor: *background
      defaultDialColors: [*blue, *green]
      defaultChartColors: [*blue, *green]
      resourceColors:
        cpu: [*blue, *green]
        mem: [*purple, *amber]
      focusFgColor: *text
      focusBgColor: *yellow
    xray:
      fgColor: *text
      bgColor: *background
      cursorColor: *selection
      cursorTextColor: *text
      graphicColor: *blue
    yaml:
      keyColor: *blue
      colonColor: *text
      valueColor: *green
    picker:
      mainColor: *blue
      focusColor: *green
      shortcutColor: *amber
    logs:
      fgColor: *text
      bgColor: *background
      indicator:
        fgColor: *blue
        bgColor: *background
        toggleOnColor: *green
        toggleOffColor: *muted
