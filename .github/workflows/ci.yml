# Docs: https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax
name: CI
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  ci:
    name: CI
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      # Re-render rather than only validating. The tool folders are fetched
      # directly by chezmoi externals, so a palette edited without re-running the
      # renderer would ship stale colours to every machine that pulls this repo.
      # Rendering also runs the readability contract, which exits non-zero on a
      # palette that would be hard to read.
      - name: Render every palette
        run: uv run render.py
      - name: Verify generated files match palettes/
        run: |
          status="$(git status --porcelain)"
          printf '%s\n' "$status"
          test -z "$status"
