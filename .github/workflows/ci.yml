# Docs: https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax
name: CI
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
defaults:
  run:
    shell: bash
jobs:
  ci:
    name: CI
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: ${{ github.event_name != 'pull_request' && 1 || 0 }}
          persist-credentials: false
      - name: Install tools
        uses: $/.github/actions/setup-mise
      - name: Sync validation environments
        env:
          UV_MALWARE_CHECK: "1"
        run: |
          uv sync --locked --preview-features malware-check
          uv sync --locked --preview-features malware-check --script artworks/generate.py
      - name: Scan pull request commits for secrets
        if: ${{ github.event_name == 'pull_request' }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: betterleaks git --config .betterleaks.toml --redact=100 --verbose --no-banner --log-opts="${BASE_SHA}..${HEAD_SHA}"
      - name: Validate themes, documentation and artwork
        run: mise run all
      - name: Verify no changes
        run: git status --short && [ -z "$(git status --porcelain)" ]
