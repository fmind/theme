# https://docs.github.com/en/communities/using-templates-to-encourage-useful-issues-and-pull-requests/syntax-for-issue-forms
name: Theme problem
description: Report an installation, color or usability problem.
body:
  - type: input
    id: app
    attributes:
      label: Application and version
      placeholder: "Ghostty 1.3.1"
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Operating system and version
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: Theme version or commit
      description: Include the source path or download link you used.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Installation and reproduction steps
      description: Include relevant theme settings, using synthetic examples and removing personal data.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
      description: Screenshots are useful; remove account details and private content first.
    validations:
      required: true
