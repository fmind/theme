# Docs: https://mise.jdx.dev/configuration.html
[tools]
bat = "0.26.1"
betterleaks = "1.9.0"
dprint = "0.64.3"
ffmpeg = "9.0.2"
fish = "4.9.3"
imagemagick = "7.1.2_31"
jactionlint = "2.4.0"
lefthook = "2.2.2"
neovim = "0.12.6"
node = "26.13.0"
python = "3.14.10"
ruff = "0.17.3"
shellcheck = "0.11.0"
ttyd = "1.7.7"
uv = "0.13.6"
vhs = "0.12.1"
zellij = "0.45.1"

[task_config]
dir = "{{config_root}}"

[tasks.all]
alias = "a"
description = "Validate themes, documentation and artwork"
run = ["mise run check", "mise run test"]

[tasks.artwork]
description = "Regenerate branding SVGs, PNGs, previews and manifest from bundled assets"
run = "uv run --locked --script artworks/generate.py"

[tasks.check]
alias = "c"
description = "Run all static checks in parallel"
depends = ["check:local", "check:network"]

[tasks."check:local"]
description = "Run the static checks that need no network (pre-commit)"
depends = ["check:actions", "check:format", "check:leaks", "check:lint"]

[tasks."check:network"]
description = "Run the checks that download vulnerability data (pre-push)"
depends = ["check:vuln"]

[tasks."check:actions"]
description = "Lint and audit GitHub Actions workflows and Dependabot (jactionlint)"
run = "jactionlint"

[tasks."check:format"]
description = "Check documentation, configuration and Python formatting without writing"
run = ["dprint check", "ruff format --check ."]

[tasks."check:leaks"]
description = "Scan the last 100 commits and the working tree for leaked secrets"
run = [
  'betterleaks git --redact=100 --log-opts="--max-count=100" --no-banner --verbose',
  "betterleaks dir . --redact=100 --no-banner --verbose",
]

[tasks."check:leaks:full"]
description = "Scan the complete Git history for leaked secrets (needs a full clone)"
run = "betterleaks git --redact=100 --verbose --no-banner"

[tasks."check:lint"]
description = "Lint Python and shell scripts and validate Git hooks"
run = [
  "ruff check .",
  # --norc keeps results independent of a personal shellcheckrc.
  "git ls-files -z '*.sh' | xargs -0 shellcheck --norc",
  "lefthook validate",
]

[tasks."check:vuln"]
description = "Audit the root, artwork script and JupyterLab npm locks, including dev dependencies, with OSV and npm (requires network access)"
run = [
  "uv audit --preview-features audit-command --locked",
  "uv audit --preview-features audit-command --locked --script artworks/generate.py",
  "npm audit --prefix themes/jupyterlab --package-lock-only --ignore-scripts --include=dev --audit-level=low",
]

[tasks.format]
alias = "f"
description = "Format Python with Ruff and documentation and configuration with dprint"
depends = ["format:dprint", "format:python"]

[tasks."format:dprint"]
description = "Format documentation and configuration in dprint's scope, or only the given files"
# mise appends Lefthook's staged files; dprint still formats only paths that dprint.json includes.
run = "dprint fmt --allow-no-files"

# Lefthook passes staged files; mise hands variadic arguments over as one shell-quoted
# string, which `eval "set -- ..."` splits back safely. Without files, Ruff formats the project.
[tasks."format:python"]
description = "Sort imports and format Python, or only the given files"
usage = 'arg "[files]..."'
run = '''
eval "set -- $usage_files"
ruff check --select=I --fix --force-exclude "$@"
ruff format --force-exclude "$@"
'''

[tasks.install]
alias = "i"
description = "Install validation dependencies and Git hooks"
run = ["uv sync --locked", "lefthook install"]

[tasks.screenshots]
description = "Record the two terminal screenshots from synthetic inputs (requires Fontconfig, Chromium and GoogleSansCode Nerd Font Mono)"
run = "uv run --locked screenshots/capture.py"

[tasks.test]
alias = "t"
description = "Check the palette, theme syntax, colors, versions and format citations, documentation links and artwork"
run = "uv run --locked python -m unittest discover -s checks -q"
