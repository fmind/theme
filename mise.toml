# :schema https://mise.jdx.dev/schema/mise.json
# Docs: https://mise.jdx.dev/configuration.html

# Fail early on a mise older than the one CI pins (keep equal to `.github/actions/setup-mise/action.yml` `version:`).
min_version = "2026.11.12"

# Verify the signatures that mise.lock records (cosign, GitHub attestations), as CI does by
# default; this overrides a global opt-out so a full `mise lock` works on every machine.
[settings]
aqua.cosign = true
github_attestations = true
locked = true
lockfile = true
lockfile_platforms = ["linux-arm64", "linux-x64", "macos-arm64"]
minimum_release_age = "0d"

[settings.task]
run_auto_install = false
# Preserve child output; MISE_TASK_QUIET=false restores execution messages.
quiet = true

[tools]
betterleaks = "1.10.1"
dprint = "0.65.0"
jactionlint = { version = "2.6.0", workflow = "release.yaml" }
lefthook = "2.2.2"
# Node.js runs the design.md linter; mise locks its npm dependencies under .mise/locks/.
node = "26.13.1"
"npm:@google/design.md" = "0.4.0"
python = "3.15.2"
shellcheck = "0.11.0"
uv = "0.13.9"

[task_config]
dir = "{{config_root}}"

[tasks.all]
alias = "a"
description = "Validate themes, documentation and artwork"
run = ["mise run check", "mise run test"]

[tasks.artwork]
description = "Regenerate branding SVGs, PNGs, previews and manifest from bundled assets"
dir = "{{config_root}}/artworks"
run = "mise exec -- uv run --locked --script generate.py"

[tasks.check]
alias = "c"
description = "Run all static checks in parallel"
depends = ["check:local", "check:network"]

[tasks."check:local"]
description = "Run the static checks that need no network (pre-commit)"
depends = [
  "check:actions",
  "check:design",
  "check:format",
  "check:leaks",
  "check:lint",
  "check:shell",
  "check:tasks",
  "check:types",
]

[tasks."check:network"]
description = "Run the checks that download vulnerability data (pre-push)"
depends = ["check:vuln"]

[tasks."check:actions"]
description = "Lint and audit GitHub Actions workflows and Dependabot offline (jactionlint)"
run = "jactionlint --profile pedantic"

[tasks."check:actions:online"]
description = "Audit GitHub Actions workflows online for impostor commits and vulnerable actions"
run = "jactionlint --online=strict --strict-exit"

[tasks."check:design"]
description = "Lint DESIGN.md structure, token references and WCAG contrast, and compare the generated token files (design.md)"
run = "uv run --locked python checks/design.py"

[tasks."check:format"]
description = "Check documentation, configuration, Python formatting, and lockfiles without writing"
run = [
  "uv run --locked validate-pyproject pyproject.toml",
  "dprint check",
  "uv run --locked ruff format --check .",
  "uv lock --check",
  "uv lock --check --script artworks/generate.py",
]

[tasks."check:leaks"]
description = "Scan working-tree files, including untracked files, for leaked secrets"
# betterleaks 1.10+ loads .betterleaks.toml only when named explicitly.
run = "betterleaks dir . --config .betterleaks.toml --redact=100 --verbose --no-banner"

[tasks."check:leaks:full"]
description = "Scan the complete Git history (weekly in security.yml; needs a full clone)"
run = "betterleaks git --config .betterleaks.toml --redact=100 --verbose --no-banner"

[tasks."check:lint"]
description = "Lint Python sources (ruff)"
run = "uv run --locked ruff check ."

[tasks."check:shell"]
description = "Lint shell theme scripts (shellcheck)"
# --norc keeps results independent of a personal shellcheckrc. `find` reads the working tree,
# so untracked scripts are linted and deleted ones are skipped before they are staged.
run = "find . \\( -name .git -o -name .venv -o -name .mise \\) -prune -o -name '*.sh' -exec shellcheck --norc {} +"

[tasks."check:tasks"]
description = "Validate repository task and Git hook definitions"
run = ["mise tasks validate", "lefthook validate"]

[tasks."check:types"]
description = "Type-check Python sources (ty)"
run = [
  "uv run --locked ty check checks screenshots/capture.py",
  'uv run --locked ty check --python "$(uv python find --script artworks/generate.py)" artworks/generate.py',
]

[tasks."check:vuln"]
description = "Audit the root and artwork script locks with OSV (requires network access)"
run = [
  "uv audit --preview-features audit-command --locked",
  "uv audit --preview-features audit-command --locked --script artworks/generate.py",
]

[tasks.format]
alias = "f"
description = "Format Python with Ruff and documentation and configuration with dprint"
depends = ["format:dprint", "format:python"]

[tasks."format:dprint"]
description = "Format documentation and configuration in dprint's scope, or only the given files"
# mise appends Lefthook's staged files; dprint still formats only paths that dprint.json includes.
run = "dprint fmt --allow-no-files"

# Lefthook passes staged files; mise hands variadic arguments over as one shell-quoted
# string, which `eval "set -- ..."` splits back safely. Without files, Ruff formats the project.
[tasks."format:python"]
description = "Sort imports and format Python, or only the given files"
usage = 'arg "[files]..." default="."'
run = '''
set -eu
eval "set -- ${usage_files:-}"
uv run --locked ruff check --select=I --fix --force-exclude -- "$@"
uv run --locked ruff format --force-exclude -- "$@"
'''

[tasks.install]
alias = "i"
description = "Install validation dependencies, refusing known malware, and Git hooks"
run = [
  "UV_MALWARE_CHECK=1 uv sync --locked --preview-features malware-check",
  "UV_MALWARE_CHECK=1 uv sync --locked --preview-features malware-check --script artworks/generate.py",
  "lefthook install",
]

[tasks.screenshots]
description = "Record the two terminal screenshots from synthetic inputs (Linux; requires Fontconfig, Chromium and GoogleSansCode Nerd Font Mono)"
dir = "{{config_root}}/screenshots"
run = "mise exec -- python3 capture.py"

[tasks.tokens]
description = "Regenerate the CSS and Tailwind token files from DESIGN.md"
run = "uv run --locked python checks/design.py --write"

[tasks.test]
alias = "t"
description = "Check the palette, theme syntax, colors, versions and format citations, documentation links and artwork"
env.TZ = "UTC"
run = "uv run --locked python -W error -m unittest discover -s checks -q"

[tasks.upgrade]
alias = "u"
description = "Upgrade root and artwork Python dependencies within constraints, refusing known malware"
run = [
  "UV_MALWARE_CHECK=1 uv sync --upgrade --preview-features malware-check",
  "UV_MALWARE_CHECK=1 uv sync --upgrade --preview-features malware-check --script artworks/generate.py",
]
