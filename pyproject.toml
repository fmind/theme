# https://docs.astral.sh/uv/concepts/projects/config/
[project]
name = "fmind-theme"
version = "5.0.0"
requires-python = ">=3.14"

[dependency-groups]
dev = [
  "pyyaml>=6.0.3",
  "markdown>=3.10.3",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py314"
# Ruff formats Python code blocks in Markdown by default; dprint owns Markdown, and theme READMEs and fixtures stay native.
extend-exclude = ["*.md"]
