# https://partnermarketinghub.withgoogle.com/brands/google-news/visual-identity/color-palette/
# Syntax and ANSI role mappings checked for 4.5:1 text contrast on white.
# Canonical 20 hex palette colors and UI surfaces live in DESIGN.md.
ground: "#ffffff"
text: &text "#202124"
gutter: "#595d62"
# Secondary syntax shares colors deliberately; structure supplies the detail.
roles:
  variable: *text
  error: &red "#a50e0e"
  string: &green "#0d652d"
  number: &orange "#934900"
  function: &blue "#174ea6"
  keyword: *blue
  type: &purple "#681da8"
  punctuation: &punctuation "#202124"
  comment: &comment "#595d62"
  warning: *orange
  escape: *blue
  constant: *orange
  parameter: *text
  builtin: *purple
  property: *text
# Supporting purple and teal keep ANSI magenta/cyan distinct.
# White slots use dark foregrounds for this light terminal.
ansi:
  black: *text
  red: *red
  green: *green
  yellow: *orange
  blue: *blue
  magenta: *purple
  cyan: &teal "#00636d"
  white: *punctuation
  bright_black: *comment
  bright_red: *red
  bright_green: *green
  bright_yellow: *orange
  bright_blue: *blue
  bright_magenta: *purple
  bright_cyan: *teal
  bright_white: *text
