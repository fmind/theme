[skin]
    description = Fmind light skin for Midnight Commander
    256colors = true

[core]
    _default_ = #202124;#ffffff
    selected = #202124;#d2e3fc
    marked = #174ea6;#ffffff
    markselect = #174ea6;#d2e3fc
    gauge = #ffffff;#174ea6
    input = #202124;#ffffff
    reverse = #ffffff;#202124
    header = #174ea6;#ffffff

[dialog]
    _default_ = #202124;#f1f3f4
    dfocus = #ffffff;#174ea6
    dhotnormal = #174ea6;#f1f3f4
    dhotfocus = #ffffff;#174ea6

[error]
    _default_ = #a50e0e;#fad2cf
    errdhotnormal = #a50e0e;#fad2cf
    errdhotfocus = #ffffff;#a50e0e

[menu]
    _default_ = #202124;#ffffff
    menusel = #ffffff;#174ea6
    menuhot = #174ea6;#ffffff
    menuhotsel = #ffffff;#174ea6

[buttonbar]
    hotkey = #174ea6;#f1f3f4
    button = #202124;#f1f3f4

[editor]
    _default_ = #202124;#ffffff
    editbold = #174ea6;#ffffff;bold
    editmarked = #202124;#d2e3fc
    editwhitespace = #9aa0a6;#ffffff
    editlinestate = #595d62;#f1f3f4

[viewer]
    _default_ = #202124;#ffffff
    viewbold = #174ea6;#ffffff;bold
    viewunderline = #681da8;#ffffff;underline
    viewselected = #202124;#d2e3fc
